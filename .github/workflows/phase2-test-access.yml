name: Phase 2 test franchise isolation
on:
  workflow_dispatch:
  push:
    paths:
      - "server.js"
      - "lib/franchise-test-access.js"
      - "lib/platform-admin-auth.js"
      - "lib/public-franchise-requests.js"
      - "public/platform-admin.js"
      - "public/platform-admin.html"
      - "public/app-core.js"
      - "public/phase2-test.*"
      - "scripts/phase2-test-access-regression.js"
      - ".github/workflows/phase2-test-access.yml"
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Validate source
        run: |
          node --check server.js
          node --check lib/franchise-test-access.js
          node --check lib/platform-admin-auth.js
          node --check lib/public-franchise-requests.js
          node --check public/platform-admin.js
          node --check public/app-core.js
          node --check public/phase2-test.js
      - name: Verify Phase 2 test-account tenant restrictions
        run: node scripts/phase2-test-access-regression.js
