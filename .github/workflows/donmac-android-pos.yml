name: Build Don Mac POS Android WebView APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-pos/**'
      - '.github/workflows/donmac-android-pos.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Don Mac POS
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 platform with runner SDK tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --licenses < <(yes) >/dev/null
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' < <(yes)
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Android debug APK
        working-directory: android-pos
        run: gradle assembleDebug --no-daemon
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: Don-Mac-POS-Android-Test-APK
          path: android-pos/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
