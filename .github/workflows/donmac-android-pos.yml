name: Build Don Mac POS Android WebView APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-pos/**'
      - '.github/workflows/donmac-android-pos.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Don Mac POS
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Android debug APK
        working-directory: android-pos
        run: gradle assembleDebug --no-daemon
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: Don-Mac-POS-Android-Test-APK
          path: android-pos/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
