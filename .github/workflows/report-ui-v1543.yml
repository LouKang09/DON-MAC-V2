name: Don Mac v1.5.43 subscription preview tests
on:
  push:
    branches:
      - main
      - feature/dev-pro-business-plans-v1543
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS parse and legacy regressions
        run: |
          node --check server.js
          node --check public/app-core.js
          node --check public/app.js
          node --check lib/development-subscriptions.js
          node report-ui-v1541-test.js
          node report-ui-v1542-test.js
      - name: Exercise demo subscription switching and Pro transfer restrictions
        run: node report-ui-v1543-test.js
