name: Admin live applications and safe demo retirement
on:
  workflow_dispatch:
  push:
    paths:
      - "server.js"
      - "lib/retire-test-franchise-accounts.js"
      - "lib/public-franchise-requests.js"
      - "lib/platform-accounts.js"
      - "lib/franchise-test-access.js"
      - "public/platform-admin.html"
      - "public/platform-admin.js"
      - "public/platform-admin.css"
      - "public/index.html"
      - "public/auth-login-v1574.*"
      - "scripts/franchise-application-access-status-test.js"
      - "scripts/franchise-plan-request-test.js"
      - "scripts/retire-demo-accounts-postgres-test.js"
      - ".github/workflows/admin-live-onboarding.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: demo_retirement
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d demo_retirement"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PG_TEST_URL: postgres://test:test@localhost:5432/demo_retirement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Syntax and scoped live checkout
        run: |
          node --check server.js
          node --check public/platform-admin.js
          node --check public/auth-login-v1574.js
          node --check lib/retire-test-franchise-accounts.js
          node --check lib/platform-accounts.js
          node --check lib/public-franchise-requests.js
          node scripts/franchise-live-static-regression.js
      - name: Signup, OTP and Admin Control plan UX
        run: |
          node scripts/franchise-application-access-status-test.js
          node scripts/franchise-plan-request-test.js
          node scripts/signup-otp-selfservice-test.js
      - name: Install PostgreSQL driver
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Guarded demo retirement and username reuse on PostgreSQL
        run: node scripts/retire-demo-accounts-postgres-test.js
