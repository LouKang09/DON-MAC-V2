name: Don Mac commercial UI and report release gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'lib/**'
      - 'server.js'
      - 'scripts/commercial-*.js'
      - '.github/workflows/commercial-release-gate.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and report scope tests
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          node --check server.js
          node --check public/app-core.js
          node --check public/franchise-unified-adapter.js
          node scripts/commercial-cashier-role-scope-regression.js
          node scripts/cashier-sales-report-privacy-regression.js
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Install browser test client
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund puppeteer-core@24
      - name: Test POS and office layout matrix
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/commercial-layout-browser-test.js
  postgres-report-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: commercial_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d commercial_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Run disposable database report tests
        env:
          COMMERCIAL_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/commercial_qa
        run: node scripts/commercial-report-postgres-test.js
  legacy-baseline-comparison:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Distinguish existing historical assertion failures from new regressions
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/donmac-baseline 110f9ea7e1906ea424f2ab6bf234b41e246aaf7a
          for test in report-ui-v1542-test.js report-ui-v1543-test.js report-ui-v1544-test.js report-ui-v1545-test.js report-ui-v1546-test.js scripts/office-canonical-routes-test.js; do
            set +e
            (cd /tmp/donmac-baseline && node "$test") > /tmp/base.log 2>&1
            base=$?
            node "$test" > /tmp/new.log 2>&1
            candidate=$?
            set -e
            echo "$test baseline=$base candidate=$candidate"
            if [[ "$candidate" != 0 ]]; then
              base_error=$(grep -m1 -E 'AssertionError|Error:' /tmp/base.log || true)
              new_error=$(grep -m1 -E 'AssertionError|Error:' /tmp/new.log || true)
              printf 'BASE: %s\nCANDIDATE: %s\n' "$base_error" "$new_error"
              if [[ "$base" == 0 || "$base_error" != "$new_error" || -z "$new_error" ]]; then
                cat /tmp/new.log
                exit 1
              fi
              echo "::warning::Existing historical test failure, unchanged by this release: $test"
            fi
          done
      - name: Current isolated adapter contract
        run: node scripts/franchise-unified-adapter-test.js
