name: Build Android attendance test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-attendance/**'
      - '.github/workflows/android-attendance.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build test APK
        run: gradle -p android-attendance assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: donmac-attendance-test-apk
          path: android-attendance/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish test APK for POS download
        run: |
          mkdir -p public/downloads
          cp android-attendance/app/build/outputs/apk/debug/app-debug.apk public/downloads/donmac-attendance-test.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/donmac-attendance-test.apk
          git diff --cached --quiet && exit 0
          git commit -m "Publish Android attendance test APK"
          git pull --rebase origin main
          git push origin HEAD:main
