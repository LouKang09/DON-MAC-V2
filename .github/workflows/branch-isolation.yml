name: Don Mac branch isolation checks
on:
  workflow_dispatch:
  push:
    paths:
      - "server.js"
      - "lib/branch-*.js"
      - "lib/legacy-catalog-guard.js"
      - "lib/cashier-access.js"
      - "lib/pos-finance.js"
      - "scripts/cashier-access-finance-test.js"
      - "lib/inventory-transfer-branches.js"
      - "lib/marlou-test-stock-reset.js"
      - "lib/branch-incoming-supply.js"
      - "scripts/branch-incoming-supply-test.js"
      - "scripts/*isolation*.js"
      - "scripts/*tenant*.js"
      - "scripts/legacy-catalog-guard-test.js"
      - ".github/workflows/branch-isolation.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/branch-isolated-schema-test.js
      - run: node scripts/branch-catalog-seeding-test.js
      - run: node scripts/tenant-branch-access-test.js
      - run: node scripts/branch-isolation-audit-test.js
      - run: node scripts/branch-isolation-read-scope-test.js
      - run: node scripts/branch-catalog-read-test.js
      - run: node scripts/legacy-catalog-guard-test.js
      - run: node scripts/inventory-transfer-branches-test.js
      - run: node scripts/marlou-test-stock-reset-test.js
      - run: node scripts/cashier-access-finance-test.js
      - run: node scripts/branch-incoming-supply-test.js
      - run: node scripts/franchise-onboarding-test.js
      - run: node scripts/otp-isolation-test.js
