name: Paid franchise live POS cutover
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server.js"
      - "public/app-core.js"
      - "public/app.js"
      - "public/franchise-unified-adapter.js"
      - "lib/franchise-unified-dashboard.js"
      - "lib/franchise-account-modes.js"
      - "lib/franchise-test-access.js"
      - "lib/franchise-live-scope.js"
      - "lib/franchise-live-finance.js"
      - "public/pos-finance.js"
      - "scripts/franchise-account-mode-test.js"
      - "scripts/franchise-main-pos-promotion-test.js"
      - "lib/franchise-live-router.js"
      - "scripts/franchise-unified-adapter-test.js"
      - "scripts/franchise-unified-browser-test.js"
      - "scripts/franchise-live-static-regression.js"
      - ".github/workflows/franchise-live-cutover.yml"
  push:
    paths:
      - "server.js"
      - "public/app-core.js"
      - "public/app.js"
      - "public/index.html"
      - "public/auth-shell-guard-v20261115.css"
      - "lib/cashier-access.js"
      - "lib/franchise-account-modes.js"
      - "lib/franchise-live-finance.js"
      - "scripts/franchise-account-mode-test.js"
      - "public/pos-finance.js"
      - "lib/franchise-test-access.js"
      - "scripts/signup-otp-selfservice-test.js"
      - "public/franchise-live.*"
      - "lib/franchise-live-*.js"
      - "lib/franchise-unified-dashboard.js"
      - "public/franchise-unified-adapter.js"
      - "scripts/franchise-unified-adapter-test.js"
      - "scripts/franchise-unified-browser-test.js"
      - "public/platform-admin.js"
      - "scripts/franchise-live-static-regression.js"
      - "scripts/franchise-live-postgres-test.js"
      - "scripts/pos-20261117-regression-test.js"
      - "scripts/team-notifications-logout-regression.js"
      - "scripts/franchise-live-browser-test.js"
      - "scripts/franchise-setup-before-paid-browser-test.js"
      - ".github/workflows/franchise-live-cutover.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: franchise_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d franchise_live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PG_TEST_URL: postgres://test:test@localhost:5432/franchise_live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Validate syntax of checkout, routing and live UI
        run: |
          node --check server.js
          node --check public/app-core.js
          node --check public/franchise-unified-adapter.js
          node --check lib/franchise-unified-dashboard.js
          node --check public/franchise-live.js
          node --check lib/franchise-live-scope.js
          node --check lib/franchise-account-modes.js
          node --check lib/franchise-live-catalog.js
          node --check lib/franchise-live-sales.js
          node --check lib/franchise-live-expenses.js
          node --check lib/franchise-live-finance.js
          node --check public/pos-finance.js
          node --check lib/franchise-live-router.js
          node --check lib/franchise-live-plan-dashboard.js
          node --check lib/franchise-audit-cost-attribution.js
          node --check public/franchise-payroll-v20261117.js
          node --check public/nav-hierarchy-v20261117.js
          node --check public/app.js
          node --check lib/franchise-test-access.js
          node --check scripts/franchise-setup-before-paid-browser-test.js
      - name: Validate fail-closed legacy routing and production feature wiring
        run: |
          node scripts/franchise-live-static-regression.js
          node scripts/franchise-unified-adapter-test.js
          node scripts/franchise-account-mode-test.js
          node scripts/franchise-main-pos-promotion-test.js
      - name: Install PostgreSQL and DOM test dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund jsdom
      - name: POS quantity, costing, Pro insights and Payroll navigation regression
        run: node scripts/pos-20261117-regression-test.js
      - name: Team messaging, unread badge, logout and system notifications
        run: node scripts/team-notifications-logout-regression.js
      - name: Real PostgreSQL cross-franchise checkout and concurrency
        run: node scripts/franchise-live-postgres-test.js
      - name: Shared Main POS owner and cashier interface
        run: node scripts/franchise-unified-browser-test.js
      - name: Browser checkout and stock warning smoke
        run: node scripts/franchise-live-browser-test.js
      - name: Browser unpaid owner setup, staff access and hidden old POS shell
        run: node scripts/franchise-setup-before-paid-browser-test.js
      - name: Email OTP signup returns main POS setup, not test
        run: node scripts/signup-otp-selfservice-test.js
