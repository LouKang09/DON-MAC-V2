services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: coffee_pos
      POSTGRES_USER: coffee_pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your server environment or .env file}
    volumes:
      - coffee_pos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee_pos -d coffee_pos"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3100}:3000"
    environment:
      DB_ENGINE: postgres
      HOST: 0.0.0.0
      PORT: 3000
      STRICT_PORT: "true"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL, for example postgresql://coffee_pos:PASSWORD@db:5432/coffee_pos}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      REPORT_EMAIL_TO: ${REPORT_EMAIL_TO:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  coffee_pos_pg:
